<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Base dark background radial gradient -->
    <radialGradient id="goldGlow" cx="85%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#dba342" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#dba342" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="topGlow" cx="20%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#3a404d" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Diagonal Band 1 Gradient -->
    <linearGradient id="band1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c0d10"/>
      <stop offset="50%" stop-color="#191c22"/>
      <stop offset="100%" stop-color="#111216"/>
    </linearGradient>

    <!-- Diagonal Band 2 Gradient (Lighter facet) -->
    <linearGradient id="band2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14161b"/>
      <stop offset="40%" stop-color="#252933"/>
      <stop offset="80%" stop-color="#1a1d24"/>
      <stop offset="100%" stop-color="#0f1014"/>
    </linearGradient>

    <!-- Diagonal Band 3 Gradient (Dark Recessed Channel) -->
    <linearGradient id="band3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#07080a"/>
      <stop offset="50%" stop-color="#14161c"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>

    <!-- Diagonal Band 4 Gradient (Main Wide Band) -->
    <linearGradient id="band4" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111317"/>
      <stop offset="45%" stop-color="#222630"/>
      <stop offset="75%" stop-color="#181b22"/>
      <stop offset="100%" stop-color="#0d0e11"/>
    </linearGradient>

    <!-- Edge Line Highlight Gradient -->
    <linearGradient id="edgeLine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="70%" stop-color="#dba342" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>

    <!-- Drop Shadow Filters for 3D Depth -->
    <filter id="shadowDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-12" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <filter id="shadowDepthSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-8" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Dark Base Background -->
  <rect width="1920" height="1080" fill="#08090b"/>

  <!-- Top Ambient Glow -->
  <rect width="1920" height="1080" fill="url(#topGlow)"/>

  <!-- Diagonal Facet Layer 1 (Top Left) -->
  <polygon points="-200,-200  600,-200  -200,1150" fill="url(#band1)"/>
  
  <!-- Diagonal Facet Layer 2 -->
  <polygon points="350,-200  950,-200  -200,1450  -200,950" fill="url(#band2)" filter="url(#shadowDepth)"/>
  <!-- Specular edge highlight line -->
  <line x1="350" y1="-200" x2="-200" y2="950" stroke="url(#edgeLine)" stroke-width="2"/>

  <!-- Diagonal Facet Layer 3 (Dark Recessed Channel) -->
  <polygon points="850,-200  1220,-200  -100,1650  -200,1450" fill="url(#band3)" filter="url(#shadowDepthSoft)"/>

  <!-- Diagonal Facet Layer 4 (Main Shaded Band) -->
  <polygon points="1150,-200  1720,-200  200,1650  -200,1650" fill="url(#band4)" filter="url(#shadowDepth)"/>
  <!-- Specular edge highlight line for Band 4 -->
  <line x1="1150" y1="-200" x2="-200" y2="1650" stroke="url(#edgeLine)" stroke-width="2.5"/>

  <!-- Diagonal Facet Layer 5 (Bottom Right Corner Facet) -->
  <polygon points="1650,-200  2200,-200  2200,1650  700,1650" fill="url(#band2)" filter="url(#shadowDepth)"/>
  <line x1="1650" y1="-200" x2="700" y2="1650" stroke="url(#edgeLine)" stroke-width="2"/>

  <!-- Gold Luxury Accent Glow (Bottom Right) -->
  <rect width="1920" height="1080" fill="url(#goldGlow)"/>
</svg>
